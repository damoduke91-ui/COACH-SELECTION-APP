name: Supabase migrations

on:
  push:
    branches: [master]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending migrations after verification
        required: true
        default: false
        type: boolean
      export_reconciliation_audit:
        description: Export read-only Production schema and migration history
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || vars.SUPABASE_MIGRATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-database
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link protected Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Show pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked
      - name: Export reconciliation audit
        if: github.event_name == 'workflow_dispatch' && inputs.export_reconciliation_audit
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          mkdir -p reconciliation-audit
          supabase db dump --linked --schema public --file reconciliation-audit/production-public-schema.sql --password "$SUPABASE_DB_PASSWORD"
          supabase db dump --linked --schema supabase_migrations --data-only --file reconciliation-audit/migration-history.sql --password "$SUPABASE_DB_PASSWORD"
          supabase migration fetch --linked
          cp -R supabase/migrations reconciliation-audit/fetched-migrations
      - name: Upload reconciliation audit
        if: github.event_name == 'workflow_dispatch' && inputs.export_reconciliation_audit
        uses: actions/upload-artifact@v4
        with:
          name: supabase-reconciliation-audit
          path: reconciliation-audit/
          retention-days: 7
      - name: Apply pending migrations
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.apply_migrations) ||
          (github.event_name == 'push' && vars.SUPABASE_MIGRATIONS_ENABLED == 'true')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"
